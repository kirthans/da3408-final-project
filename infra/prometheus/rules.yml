groups:
  - name: elo
    rules:
      - alert: ModelMAEDegraded
        # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Alert when champion all-TC MAE exceeds 1.04 times reference MAE (D30)."
        expr: max(elo_batch_mae{model="champion",tc="all"}) > 1.04 * max(elo_reference_mae)
        for: 2m
        labels: {severity: critical, route: trainer}
        annotations:
          summary: 'Champion MAE degraded ({{ $value }} Elo)'
          # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Include champion MAE / reference MAE ratio in the degradation description."
          description: 'MAE {{ $value }} exceeds 1.04 times reference; ratio={{ with query `max(elo_batch_mae{model="champion",tc="all"}) / max(elo_reference_mae)` }}{{ . | first | value | printf "%.3f" }}{{ end }}.'
      - alert: FeatureDriftHigh
        # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Warn when maximum feature PSI exceeds 0.05 (D30)."
        expr: max(elo_feature_psi) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Feature PSI high ({{ $value }})'
          description: 'Maximum feature PSI {{ $value }} exceeds 0.05.'
      - alert: CoverageOutOfBand
        # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Warn if all-TC interval coverage is outside [0.75, 0.85]."
        expr: elo_interval_coverage{tc="all"} < 0.75 or elo_interval_coverage{tc="all"} > 0.85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Coverage outside band ({{ $value }})'
          description: 'Coverage {{ $value }} is outside [0.75, 0.85].'
      - alert: ApiErrorRateHigh
        # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Warn if the five-minute API 5xx ratio exceeds 5 percent, guarding a zero denominator with 0.001 requests/second."
        expr: sum(rate(elo_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(elo_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning, job: api}
        annotations:
          summary: 'API error ratio high ({{ $value }})'
          description: 'Five-minute 5xx ratio {{ $value }} exceeds 0.05.'
      - alert: ApiLatencyP95High
        # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Warn if prediction p95 latency over five minutes exceeds 5 seconds (AC3)."
        expr: histogram_quantile(0.95, sum by (le) (rate(elo_request_latency_seconds_bucket{endpoint="/v1/predict"}[5m]))) > 5
        for: 5m
        labels: {severity: warning, job: api}
        annotations:
          summary: 'Prediction p95 latency high ({{ $value }} s)'
          description: 'Prediction p95 {{ $value }} seconds exceeds 5 seconds.'
      - alert: ServiceDown
        # PromQL generated by Codex (gpt-6.1-sol) from prompt: "Alert when any of the seven scrape jobs is down."
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.job }} down (up={{ $value }})'
          description: '{{ $labels.job }} scrape has up={{ $value }} for at least one minute.'
