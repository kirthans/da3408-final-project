global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ['api:18000']}]
  - job_name: model-server
    static_configs: [{targets: ['model-server:18003']}]
  - job_name: mlflow
    metrics_path: /metrics
    static_configs: [{targets: ['mlflow:5000']}]
  - job_name: monitor
    static_configs: [{targets: ['monitor:18001']}]
  - job_name: trainer
    static_configs: [{targets: ['trainer:18002']}]
  - job_name: node-exporter
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
