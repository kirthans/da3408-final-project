route:
  receiver: log
  routes:
    - matchers: ['alertname="ModelMAEDegraded"']
      receiver: trainer
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
receivers:
  - name: log
  - name: trainer
    webhook_configs:
      - url: http://trainer:8001/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/trainer_api_key
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [job]
  - source_matchers: ['alertname="ModelMAEDegraded"']
    target_matchers: ['alertname="FeatureDriftHigh"']
