data:
  months: ["2019-09", "2019-10", "2019-11", "2019-12", "2020-01", "2020-02", "2020-03", "2020-04", "2020-05", "2020-06", "2020-07", "2020-08", "2020-09", "2020-10", "2020-11", "2020-12"]
  base_url: https://database.lichess.org/standard
  train_months: ["2019-09", "2019-10", "2019-11", "2019-12"]
  replay_months:
    - "2020-01"
    - "2020-02"
    - "2020-03"
    - "2020-04"
    - "2020-05"
    - "2020-06"
    - "2020-07"
    - "2020-08"
    - "2020-09"
    - "2020-10"
    - "2020-11"
    - "2020-12"
  max_games_per_month: 60000
sample:
  train_per_month: 20000
  replay_per_month: 10000
spark:
  driver_memory: 4g
  shuffle_partitions: 8
engine:
  nodes: 5000
  hash_mb: 16
  path: tools/stockfish/stockfish
  game_timeout_s: 120
ray:
  num_workers: 10
  batch_size: 16
seed: 42
train:
  fit_months: ["2019-09", "2019-10", "2019-11", "2019-12", "2020-01", "2020-02", "2020-03"]
  holdout_month: "2020-04"
  clock_dropout: 0.2
  conformal_alpha: 0.2
  experiment: elo
  xgb:
    grid: {max_depth: [4, 6, 8], learning_rate: [0.05, 0.1]}
    n_estimators: 3000
    early_stopping_rounds: 100
    n_jobs_per_trial: 2
drift: {}

monitor:
  interval_s: 900
  eval_interval_s: 30
  mae_ratio: 1.04
  psi_warn: 0.05
  drift_injection: {enabled: false, month: "2020-06", cpl_scale: 1.4}
retrain:
  min_improvement: 1.0
  cooldown_s: 600
  coverage_band: [0.75, 0.85]
