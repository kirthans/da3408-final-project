stages:
  # Analyze sampled games with persistent Ray/Stockfish actors (DESIGN D2).
  analyze:
    foreach: ${data.months}
    do:
      cmd: python -m elo.data.ray_analyze --month ${item}
      deps:
        - src/elo/data/ray_analyze.py
        - src/elo/pgn
        - src/elo/engine
        - src/elo/features
        - src/elo/common
        - tools/stockfish/stockfish
        - data/interim/sample/${item}.parquet
      params:
        - engine
        - ray
      outs:
        - data/features/moves/${item}.parquet
      metrics:
        - reports/throughput/analyze_${item}.json:
            cache: false
  # Stream a bounded monthly prefix from the compressed Lichess dump.
  download:
    foreach: ${data.months}
    do:
      cmd: python -m elo.data.download --month ${item}
      deps:
        - src/elo/data/download.py
        - src/elo/common
      params:
        - data.max_games_per_month
        - data.base_url
      outs:
        - data/raw/${item}.pgn
      metrics:
        - reports/download/${item}.json:
            cache: false
  # Parse game records in Spark and enforce the safe data contract (DESIGN D1).
  ingest_validate:
    foreach: ${data.months}
    do:
      cmd: python -m elo.data.spark_ingest --month ${item}
      deps:
        - src/elo/data/spark_ingest.py
        - src/elo/common
        - data/raw/${item}.pgn
      params:
        - data.train_months
        - seed
        - spark.driver_memory
        - spark.shuffle_partitions
      outs:
        - data/interim/games/${item}.parquet
      metrics:
        - reports/validation/${item}.json:
            cache: false
  # Select a seeded, time-control-stratified monthly sample.
  sample:
    foreach: ${data.months}
    do:
      cmd: python -m elo.data.spark_sample --month ${item}
      deps:
        - src/elo/data/spark_sample.py
        - src/elo/data/spark_ingest.py
        - src/elo/common
        - data/interim/games/${item}.parquet
      params:
        - data.train_months
        - sample.train_per_month
        - sample.replay_per_month
        - seed
        - spark.driver_memory
        - spark.shuffle_partitions
      outs:
        - data/interim/sample/${item}.parquet
      metrics:
        - reports/sample/${item}.json:
            cache: false
  # Aggregate analyzed plies into two player-perspective rows per game (DESIGN D6).
  aggregate:
    foreach: ${data.months}
    do:
      cmd: python -m elo.training.dataset --month ${item}
      deps:
      - src/elo/models/aggregate.py
      - src/elo/training/dataset.py
      - src/elo/common/config.py
      - src/elo/common/logging.py
      - data/features/moves/${item}.parquet
      - data/interim/sample/${item}.parquet
      outs:
      - data/features/games/${item}.parquet
  # Build fit rows and disjoint validation/calibration/test holdout thirds (DESIGN §24 A4).
  build_dataset:
    cmd: python -m elo.training.dataset
    deps:
    - src/elo/models/aggregate.py
    - src/elo/training/dataset.py
    - src/elo/common/config.py
    - src/elo/common/logging.py
    - data/features/games
    - data/features/moves
    - data/interim/sample
    params:
    - train.fit_months
    - train.holdout_month
    - train.clock_dropout
    - seed
    outs:
    - data/datasets
    metrics:
    - reports/dataset.json:
        cache: false
  # Log three simple reference predictors through an MLproject (DESIGN D13).
  train_baselines:
    cmd: set -a; . ./.env; set +a; mlflow run . -e train_baselines --env-manager=local
      --experiment-name ${train.experiment}
    deps:
    - src/elo/models/aggregate.py
    - src/elo/training/dataset.py
    - src/elo/common/config.py
    - src/elo/common/logging.py
    - src/elo/models/conformal.py
    - src/elo/models/scoring.py
    - src/elo/training/pipeline.py
    - src/elo/common/errors.py
    # MLproject entry-point additions do not change this stage's behavior.
    - MLproject
    - data/datasets
    params:
    - train.experiment
    metrics:
    - reports/baselines.json:
        cache: false
  # Sweep XGBoost and calibrate the validation winner on untouched residuals (DESIGN D4, D7).
  train_xgb:
    cmd: set -a; . ./.env; set +a; mlflow run . -e train_xgb --env-manager=local --experiment-name
      ${train.experiment}
    deps:
    - src/elo/models/aggregate.py
    - src/elo/training/dataset.py
    - src/elo/common/config.py
    - src/elo/common/logging.py
    - src/elo/models/conformal.py
    - src/elo/models/scoring.py
    - src/elo/training/pipeline.py
    - src/elo/common/errors.py
    # MLproject entry-point additions do not change this stage's behavior.
    - MLproject
    - data/datasets/train.parquet
    - data/datasets/val.parquet
    - data/datasets/cal.parquet
    - data/datasets/reference_stats.json
    params:
    - train.experiment
    - train.xgb
    - train.conformal_alpha
    - seed
    outs:
    - models/xgb
    metrics:
    - reports/train_xgb.json:
        cache: false
  # Publish held-out acceptance metrics, replay evaluation and diagnostic plots.
  evaluate:
    cmd: set -a; . ./.env; set +a; mlflow run . -e evaluate --env-manager=local --experiment-name
      ${train.experiment}
    deps:
    - src/elo/models/aggregate.py
    - src/elo/training/dataset.py
    - src/elo/common/config.py
    - src/elo/common/logging.py
    - src/elo/models/conformal.py
    - src/elo/models/scoring.py
    - src/elo/training/pipeline.py
    - src/elo/common/errors.py
    # MLproject entry-point additions do not change this stage's behavior.
    - MLproject
    - models/xgb
    - data/datasets/test.parquet
    - reports/baselines.json
    - reports/train_xgb.json
    - reports/dataset.json
    - data/features/games
    - reports/throughput
    params:
    - train.experiment
    - train.fit_months
    - data.replay_months
    metrics:
    - reports/metrics.json:
        cache: false
    - reports/replay_eval.json:
        cache: false
    plots:
    - reports/plots/coverage.png:
        cache: false
    outs:
    - reports/plots/residual.png:
        cache: false
    - reports/plots/predicted.png:
        cache: false
    - reports/plots/confusion.png:
        cache: false
  # Record test outcomes and portable JUnit evidence without caching report contents.
  tests:
    cmd: python -m elo.training.checks tests
    deps:
    - src
    - tests
    metrics:
    - reports/tests.json:
        cache: false
    outs:
    - reports/tests.xml:
        cache: false
  # Package the versioned pyfunc and assign its initial registry alias (DESIGN D10-D11).
  register:
    cmd: set -a; . ./.env; set +a; mlflow run . -e register --env-manager=local --experiment-name elo
    deps:
    - src/elo/models/aggregate.py
    - src/elo/models/pyfunc.py
    - src/elo/training/registry.py
    - src/elo/common/logging.py
    # MLproject entry-point additions do not change this stage's behavior.
    - MLproject
    - models/xgb
    - reports/metrics.json
    outs:
    - reports/register.json:
        cache: false
